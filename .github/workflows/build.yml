name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache runtime components
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/bundled_components
          key: components-${{ hashFiles('tools/components.sha256') }}

      - name: Fetch runtime components
        run: tools/fetch_components.sh

      - name: Unit tests
        run: ./gradlew testModernDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleModernDebug

      - uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/modern/debug/*.apk
          # Private-repo artifacts count against the account's Actions storage; keep them one day.
          retention-days: ${{ github.event.repository.private && 1 || 14 }}

      # Publish a GitHub release for every new versionName pushed to main or thor-split (Obtainium
      # watches this repo's releases). Bump versionName/versionCode in app/build.gradle.kts to release.
      - name: Read version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: exists
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/thor-split'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.name }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.exists.outputs.released == 'false'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/modern/debug/*.apk "release/ThorWoW-v${{ steps.ver.outputs.name }}.apk"
          gh release create "v${{ steps.ver.outputs.name }}" release/*.apk \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v${{ steps.ver.outputs.name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
