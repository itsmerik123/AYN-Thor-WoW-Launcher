name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache runtime components
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/bundled_components
          key: components-${{ hashFiles('tools/components.sha256') }}

      - name: Fetch runtime components
        run: tools/fetch_components.sh

      - name: Unit tests
        run: ./gradlew testModernDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleModernDebug

      - uses: actions/upload-artifact@v4
        with:
          name: wow-${{ github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/modern/debug/*.apk
          # Private-repo artifacts count against the account's Actions storage; keep them one day.
          retention-days: ${{ github.event.repository.private && 1 || 14 }}

      # Tag a commit vX.Y.Z to publish a release. Obtainium watches this repo's releases for the APK.
      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          cp app/build/outputs/apk/modern/debug/*.apk "release/ThorWoW-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
